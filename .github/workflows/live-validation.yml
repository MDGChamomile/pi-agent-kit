name: live-validation

on:
  push:
    paths:
      - "live/extensions/pi-subagent/**"
      - "live/skills/**"
      - "packaging/pi-subagent/**"
      - ".github/workflows/pi-subagent-canary.yml"
      - ".github/workflows/live-validation.yml"
  pull_request:
    paths:
      - "live/extensions/pi-subagent/**"
      - "live/skills/**"
      - "packaging/pi-subagent/**"
      - ".github/workflows/pi-subagent-canary.yml"
      - ".github/workflows/live-validation.yml"

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
      - name: Validate session-search
        working-directory: live/skills/session-search
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Validate deep-plan publication
        run: node --test live/skills/deep-plan/scripts/publish-plan.test.mjs
      - name: Validate skill frontmatter and relative Markdown links
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          failures = []
          for skill in sorted(Path("live/skills").glob("**/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              if not text.startswith("---\n") or "\nname:" not in text or "\ndescription:" not in text:
                  failures.append(f"invalid frontmatter: {skill}")
              for target in re.findall(r"\[[^]]*\]\(([^)]+)\)", text):
                  if "://" in target or target.startswith("#"):
                      continue
                  path = (skill.parent / target.split("#", 1)[0]).resolve()
                  if not path.exists():
                      failures.append(f"broken link: {skill} -> {target}")
          if failures:
              raise SystemExit("\n".join(failures))
          PY

  pi-subagent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pi-version: ["0.84.2", "0.84.3"]
    defaults:
      run:
        working-directory: live/extensions/pi-subagent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: live/extensions/pi-subagent/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Select tested Pi version
        run: |
          npm install --no-save --package-lock=false --ignore-scripts \
            @earendil-works/pi-agent-core@${{ matrix.pi-version }} \
            @earendil-works/pi-ai@${{ matrix.pi-version }} \
            @earendil-works/pi-coding-agent@${{ matrix.pi-version }} \
            @earendil-works/pi-tui@${{ matrix.pi-version }}
      - run: npm test
      - run: npm run package:check
