name: validation

on:
  push:
    branches: [main, updates]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Validate session-search
        working-directory: live/skills/session-search
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - id: latest-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          update-environment: false
      - name: Validate session-search on the latest stable Python
        working-directory: live/skills/session-search
        run: PYTHONDONTWRITEBYTECODE=1 "${{ steps.latest-python.outputs.python-path }}" -m unittest discover -s tests -v
      - name: Validate skill frontmatter and maintained Markdown links
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python3 -B .github/scripts/validate_skills.py

  pi-compaction-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: live/extensions/pi-compaction-model
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: live/extensions/pi-compaction-model/package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
