name: live-validation

on:
  push:
    paths:
      - "live/extensions/pi-compaction-model/**"
      - "live/extensions/pi-subagent/**"
      - "live/skills/**"
      - "packaging/pi-subagent/**"
      - ".github/workflows/pi-subagent-canary.yml"
      - ".github/workflows/live-validation.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "live/extensions/pi-compaction-model/**"
      - "live/extensions/pi-subagent/**"
      - "live/skills/**"
      - "packaging/pi-subagent/**"
      - ".github/workflows/pi-subagent-canary.yml"
      - ".github/workflows/live-validation.yml"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
      - name: Validate session-search
        working-directory: live/skills/session-search
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Validate simplykst
        working-directory: live/skills/simplykst
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Validate deep-plan publication
        run: node --test live/skills/deep-plan/scripts/publish-plan.test.mjs
      - name: Validate skill frontmatter and relative Markdown links
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python3 -B .github/scripts/validate_skills.py

  pi-compaction-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: live/extensions/pi-compaction-model
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run check

  pi-subagent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pi-version: ["0.84.2", "0.85.0"]
    defaults:
      run:
        working-directory: live/extensions/pi-subagent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: live/extensions/pi-subagent/package-lock.json
      - name: Install native search test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - run: npm ci --ignore-scripts
      - name: Select tested Pi version
        run: |
          npm install --no-save --package-lock=false --ignore-scripts \
            @earendil-works/pi-agent-core@${{ matrix.pi-version }} \
            @earendil-works/pi-ai@${{ matrix.pi-version }} \
            @earendil-works/pi-coding-agent@${{ matrix.pi-version }} \
            @earendil-works/pi-tui@${{ matrix.pi-version }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:check
